<!DOCTYPE html>
<html>
<head>
  <title>Add Products</title>
  <meta charset="UTF-8">
</head>
<body style="background:#111;color:#fff;font-family:sans-serif;text-align:center;padding-top:50px">
  <h2>Add Products to Firebase</h2>
  <button onclick="addProducts()" style="padding:15px 30px;font-size:18px;cursor:pointer">CLICK TO ADD 2 TEST PRODUCTS</button>
  <p id="status"></p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // 1. PASTE YOUR FIREBASE CONFIG HERE
  const firebaseConfig = {
    apiKey: "PASTE HERE",
    authDomain: "PASTE HERE",
    projectId: "PASTE HERE",
    storageBucket: "PASTE HERE",
    messagingSenderId: "PASTE HERE",
    appId: "PASTE HERE"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const products = [
    {name: "Men's Cotton T-Shirt", category: "Fashion", subcategory: "Men's Wear", sub_subcategory: "T-Shirts", district: "Kozhikode", price: 499, oldPrice: 999, discount: 50, image: "https://via.placeholder.com/400"},
    {name: "Samsung Galaxy M35", category: "Mobiles", subcategory: "Smartphones", sub_subcategory: "Samsung", district: "Kasaragod", price: 15999, oldPrice: 19999, discount: 20, image: "https://via.placeholder.com/400"}
  ];

  window.addProducts = async function() {
    document.getElementById('status').innerText = "Adding...";
    try {
      for(const p of products){
        await addDoc(collection(db, "products"), p);
        console.log("✅ Added:", p.name);
      }
      document.getElementById('status').innerText = "✅ DONE! Check Firebase now";
    } catch(e) {
      document.getElementById('status').innerText = "❌ ERROR: " + e.message;
      console.error(e);
    }
  }
</script>
</body>
</html>
