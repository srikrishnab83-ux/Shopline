<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Orders - Shopline Kerala</title>
  <style>
    body{font-family:Arial; background:#f5f5f5; padding:20px}
    h1{background:#2874f0; color:#fff; padding:15px; border-radius:4px}
    .order-box{background:#fff; padding:15px; margin:15px 0; border-radius:8px}
    .error{color:red; background:#ffdddd; padding:15px; border-radius:4px}
  </style>
</head>
<body>
  <h1>📦 Shopline Kerala - All Orders</h1>
  <div id="ordersList">Loading orders...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyCX7fx7XvW6duavBYrTrzysIQN5gPyfJGo", authDomain: "willwin-cart.firebaseapp.com", projectId: "willwin-cart"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadOrders() {
  try {
    const querySnapshot = await getDocs(collection(db, "orders"));
    const ordersList = document.getElementById('ordersList');
    
    if(querySnapshot.empty){
      ordersList.innerHTML = "<p>No orders found in 'orders' collection</p>";
      return;
    }
    
    let html = '';
    querySnapshot.forEach((doc) => {
      const o = doc.data();
      html += `<div class="order-box"><b>Order ID:</b> ${doc.id}<br><b>Customer:</b> ${o.customer?.name}<br><b>Total:</b> ₹${o.finalTotal}</div>`;
    });
    ordersList.innerHTML = html;
    
  } catch(e) {
    document.getElementById('ordersList').innerHTML = `<div class="error"><b>ERROR:</b> ${e.message}<br><br>Fix: Go to Firebase > Rules and set allow read: if true;</div>`;
    console.error("FIREBASE ERROR:", e);
  }
}
loadOrders();
</script>
</body>
</html>
