<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Orders - Shopline India - All India Delivery</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body{font-family:Arial; background:#f5f5f5; padding:20px}
    h1{background:#2874f0; color:#fff; padding:15px; border-radius:4px}
    .order-box{background:#fff; padding:15px; margin:15px 0; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
    .order-header{display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding-bottom:10px; flex-wrap:wrap}
    .status{padding:5px 10px; border-radius:4px; font-weight:bold; background:#fff3cd; color:#856404}
    .item{padding:8px 0; border-bottom:1px dashed #eee}
    .address{margin-top:10px; background:#f9f9f9; padding:10px; border-radius:4px; font-size:14px}
    .total{font-size:18px; font-weight:bold; color:green; text-align:right}
    .refresh-btn{background:#fb641b; color:#fff; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; margin-bottom:10px; margin-right:10px}
    .admin-btn{background:#2874f0; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; margin:3px}
    .tracking-select{padding:5px; border:1px solid #ddd; border-radius:4px}
  </style>
</head>
<body>
  <h1>📦 Shopline India - All Orders - ADMIN - Delivery all over India</h1>
  <button class="refresh-btn" onclick="loadOrders()">🔄 Refresh Orders</button>
  <div id="ordersList">Loading orders...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const { jsPDF } = window.jspdf;
const firebaseConfig = {apiKey: "AIzaSyCX7fx7XvW6duavBYrTrzysIQN5gPyfJGo", authDomain: "willwin-cart.firebaseapp.com", projectId: "willwin-cart"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function loadOrders() {
  document.getElementById('ordersList').innerHTML = "Loading orders...";
  const snap = await db.collection("orders").orderBy("createdAt","desc").get();
  const ordersList = document.getElementById('ordersList');
  
  if(snap.empty){
    ordersList.innerHTML = "<p>No orders yet</p>";
    return;
  }
  
  let html = '';
  snap.forEach((doc) => {
    const o = doc.data();
    const date = o.createdAt ? o.createdAt.toDate().toLocaleString("en-IN") : "Just Now";
    const tracking = o.trackingStatus || 'Order Received';
    const status = o.orderStatus || 'new';
    
    let itemsHTML = '';
    o.items.forEach(item => {
      itemsHTML += `<div class="item"><b>${item.name}</b> - Qty:${item.qty} - Size:${item.size} - Color:${item.color} - <b>₹${item.price}</b></div>`;
    });
    
    html += `
      <div class="order-box">
        <div class="order-header">
          <div><b>Order ID:</b> ${doc.id}<br><b>Date:</b> ${date}</div>
          <div><span class="status">${status}</span><br><b>Total:</b> ₹${o.finalTotal}</div>
        </div>
        <div class="address">
          <b>Customer:</b> ${o.customer.name} | ${o.customer.phone}<br>
          <b>Address:</b> ${o.customer.street}, ${o.customer.district}, ${o.customer.state} - ${o.customer.pincode}<br>
          <b>Landmark:</b> ${o.customer.landmark || 'NA'}
        </div>
        <h4 style="margin-top:10px">Items:</h4>
        ${itemsHTML}
        
        <p><b>Tracking:</b> 
          <select class="tracking-select" onchange="adminUpdateTracking('${doc.id}', this.value)">
            <option ${tracking==='Order Received'?'selected':''}>Order Received</option>
            <option ${tracking==='Approved'?'selected':''}>Approved</option>
            <option ${tracking==='Packed'?'selected':''}>Packed</option>
            <option ${tracking==='Shipped'?'selected':''}>Shipped</option>
            <option ${tracking==='Reached Hub'?'selected':''}>Reached Hub</option>
            <option ${tracking==='Out for Delivery'?'selected':''}>Out for Delivery</option>
            <option ${tracking==='Delivered'?'selected':''}>Delivered</option>
          </select>
        </p>

        <p class="total">Product: ₹${o.productTotal} + Shipping: ₹${o.shippingCharge} = ₹${o.finalTotal}</p>

        <div>
          <button class="admin-btn" onclick="adminApprove('${doc.id}')">Approve</button>
          <button class="admin-btn" style="background:#ff9800" onclick="adminCancel('${doc.id}')">Cancel</button>
          <button class="admin-btn" style="background:#9c27b0" onclick="generateInvoice('${doc.id}')">Download Invoice</button>
        </div>
      </div>
    `;
  });
  ordersList.innerHTML = html;
}
loadOrders();

function adminUpdateTracking(id, status){
  db.collection("orders").doc(id).update({
    trackingStatus: status,
    orderStatus: status==='Delivered'?'delivered': status==='Shipped'?'shipped':'approved'
  }).then(()=> alert('Tracking Updated to: ' + status));
}

function adminApprove(id){
  db.collection("orders").doc(id).update({
    orderStatus: 'approved',
    trackingStatus: 'Approved'
  }).then(()=>{ alert('Order Approved'); loadOrders(); });
}

function adminCancel(id){
  let reason = prompt("Enter cancellation reason:");
  if(reason){
    db.collection("orders").doc(id).update({ status: 'Cancelled', cancelReason: reason }).then(()=>{ alert('Order Cancelled'); loadOrders(); });
  }
}

function generateInvoice(orderId){
  db.collection("orders").doc(orderId).get().then(doc=>{
    const o = doc.data();
    const docPDF = new jsPDF();
    docPDF.setFontSize(18);
    docPDF.text("Shopline India - Tax Invoice - Delivery all over India", 105, 20, {align: "center"});
    docPDF.setFontSize(12);
    docPDF.text(`Order ID: #${orderId.substring(0,6)}`, 14, 40);
    docPDF.text(`Customer: ${o.customer.name}`, 14, 50);
    docPDF.text(`Phone: ${o.customer.phone}`, 14, 60);
    docPDF.text(`Address: ${o.customer.street}, ${o.customer.district}`, 14, 70);
    docPDF.text("----------------------------------------", 14, 80);
    let y = 90;
    o.items.forEach(item=>{
      docPDF.text(`${item.name} x ${item.qty}`, 14, y);
      docPDF.text(`₹${item.price * item.qty}`, 180, y, {align: "right"});
      y += 10;
    });
    docPDF.text("----------------------------------------", 14, y);
    y += 10;
    docPDF.text(`Total Amount: ₹${o.finalTotal}`, 14, y);
    docPDF.save(`Admin-Invoice-${orderId.substring(0,6)}.pdf`);
  })
}
</script>
</body>
</html>
