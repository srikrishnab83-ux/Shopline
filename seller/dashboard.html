<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seller Dashboard - Shopline Kerala</title>
  <style>
.dashboard{max-width:1200px; margin:20px auto; padding:20px}
.tabs{display:flex; gap:10px; margin-bottom:20px; border-bottom:2px solid #eee}
.tab-btn{padding:12px 20px; border:none; background:none; cursor:pointer; font-size:16px; font-weight:bold}
.tab-btn.active{border-bottom:3px solid #2874f0; color:#2874f0}
.tab-content{display:none}
.tab-content.active{display:block}
.orders-table,.products-table{width:100%; background:#fff; border-radius:8px; margin-top:15px; font-size:14px; border-collapse:collapse}
.orders-table th,.products-table th{background:#f5f5f5; padding:12px; text-align:left}
.orders-table td,.products-table td{padding:12px; border-bottom:1px solid #eee}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:15px}
.form-group{display:flex; flex-direction:column}
.form-group label{font-weight:bold; margin-bottom:5px; font-size:14px}
.form-group input,.form-group select,.form-group textarea{padding:10px; border:1px solid #ddd; border-radius:4px}
.btn-save{padding:12px 30px; background:#388e3c; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:16px; margin-top:15px}
.btn-logout{background:#d32f2f; color:#fff; padding:8px 15px; border:none; border-radius:4px; cursor:pointer; float:right}
.btn-delete{background:#d32f2f; color:#fff; padding:6px 10px; border:none; border-radius:4px; cursor:pointer; margin-right:5px}
.btn-ship{background:#ff9f00; color:#fff; padding:6px 10px; border:none; border-radius:4px; cursor:pointer; margin-right:5px}
.img-preview{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap}
.img-box{position:relative}
.img-box img{width:100px; height:100px; object-fit:cover; border:1px solid #ddd; border-radius:4px}
.img-remove{position:absolute; top:-8px; right:-8px; background:red; color:#fff; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer}
.chip{padding:8px 12px; border:2px solid #ddd; border-radius:20px; cursor:pointer; background:#fff; display:inline-block; margin:3px; position:relative}
.chip.active{border-color:#2874f0; background:#e3f2fd; color:#2874f0}
.price-box{background:#e8f5e9; padding:15px; border-radius:8px; margin-top:10px}
.status-select{padding:6px; border:1px solid #ddd; border-radius:4px}
.stock-toggle{background:#388e3c; color:#fff; padding:4px 8px; border:none; border-radius:4px; cursor:pointer}
.stock-toggle.off{background:#9e9e9e}
  </style>
</head>
<body>
  <div style="background:#232f3e; color:#fff; padding:8px; text-align:center; font-size:12px">Seller Panel - Shopline Kerala</div>
  <header style="background:#2874f0; color:#fff; padding:15px">
    <div style="max-width:1200px; margin:auto; display:flex; justify-content:space-between">
      <div>Shopline<span style="color:#ffe500">Kerala</span> Seller</div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="dashboard">
    <div class="tabs">
      <button class="tab-btn active" onclick="openTab('orders')">📦 Orders</button>
      <button class="tab-btn" onclick="openTab('products')">🛍️ My Products</button>
      <button class="tab-btn" onclick="openTab('add')">➕ Add Product</button>
    </div>

    <div id="orders" class="tab-content active">
      <h2>Recent Orders</h2>
      <table class="orders-table"><thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody id="ordersList"></tbody></table>
    </div>

    <div id="products" class="tab-content">
      <h2>My Products</h2>
      <table class="products-table"><thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Category</th><th>Stock</th><th>Action</th></tr></thead><tbody id="productsList"></tbody></table>
    </div>

    <div id="add" class="tab-content">
      <h2>Add New Product</h2>
      <form id="addProductForm" onsubmit="addProduct(event)">
        <div class="form-grid">
          <div class="form-group"><label>Product Name *</label><input id="pName" required></div>
          <div class="form-group"><label>Category *</label><input id="pCategory" required></div>
          <div class="form-group"><label>Sub Category *</label><input id="pSubcategory" required></div>
          <div class="form-group"><label>District *</label><select id="pDistrict" required><option value="">Select</option><option>Kannur</option><option>Kozhikode</option></select></div>
        </div>
        <div class="price-box">
          <h4>Price Details</h4>
          <div class="form-grid">
            <div class="form-group"><label>Your Selling Price ₹ *</label><input id="pPrice" type="number" onkeyup="calcPrice()" required></div>
            <div class="form-group"><label>Old Price ₹</label><input id="pOldPrice" type="number"></div>
          </div>
          <p>Platform Fee: ₹20 | <b>Customer Pays: ₹<span id="customerPrice">0</span></b></p>
        </div>
        <div class="form-group">
          <label>Product Images *</label>
          <input type="file" id="pImages" accept="image/*" multiple onchange="previewImages(event)">
          <div class="img-preview" id="imgPreview"></div>
        </div>
        <div class="form-group"><label>Sizes</label><div id="sizeGrid"></div><input id="extraSize" placeholder="Add size"><button type="button" onclick="addExtraSize()">+ Add</button></div>
        <div class="form-group"><label>Colors</label><div id="colorGrid"></div><input type="color" id="extraColor"><input id="colorName" placeholder="Color Name"><button type="button" onclick="addExtraColor()">+ Add</button></div>
        <div class="form-group"><label>Description</label><textarea id="pDesc" rows="4"></textarea></div>
        <button type="submit" class="btn-save">Save Product</button>
      </form>
    </div>
  </div>

<script>
const firebaseConfig = {apiKey: "AIzaSyCX7fx7XvW6duavBYrTrzysIQN5gPyfJGo", authDomain: "willwin-cart.firebaseapp.com", projectId: "willwin-cart", storageBucket: "willwin-cart.appspot.com"};
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();
let currentUser = null;
let selectedSizes = [];
let selectedColors = [];
let uploadedImages = [];
const orderStatuses = ['Order Received','Ready to Dispatch','Shipped','Delivered','Payment Pending','Payment Received','Return Requested','Cancelled'];

auth.onAuthStateChanged(function(user){
  if(!user) location.href='login.html';
  else{ currentUser=user; loadOrders(); loadProducts(); renderSizeColor(); }
});

function logout(){ auth.signOut().then(function(){ location.href='login.html'; }); }
function openTab(tab){
  document.querySelectorAll('.tab-content').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById(tab).classList.add('active');
  event.target.classList.add('active');
}

function calcPrice(){
  var price = Number(document.getElementById('pPrice').value)||0;
  document.getElementById('customerPrice').innerText = price + 20;
}

function previewImages(e){
  uploadedImages = Array.from(e.target.files).slice(0,4);
  var box = document.getElementById('imgPreview'); box.innerHTML='';
  uploadedImages.forEach(function(f, i){
    var reader = new FileReader();
    reader.onload = function(ev){
      box.innerHTML += '<div class="img-box"><img src="' + ev.target.result + '"><button type="button" class="img-remove" onclick="removeImage(' + i + ')">X</button></div>';
    };
    reader.readAsDataURL(f);
  });
}
function removeImage(index){ uploadedImages.splice(index,1); document.getElementById('pImages').value=''; previewImages({target:{files:uploadedImages}}); }

function renderSizeColor(){
  var sizeGrid = document.getElementById('sizeGrid'); sizeGrid.innerHTML='';
  ['XS','S','M','L','XL'].forEach(function(s){
    var active = selectedSizes.includes(s)? 'active' : '';
    sizeGrid.innerHTML += '<span class="chip ' + active + '" onclick="toggleSize(\'' + s + '\')">' + s + '</span>';
  });
  var colorGrid = document.getElementById('colorGrid'); colorGrid.innerHTML='';
  selectedColors.forEach(function(c){
    colorGrid.innerHTML += '<span class="chip active" style="background:' + c.code + '; color:#fff">' + c.name + '<span onclick="removeColor(\'' + c.name + '\')"> X</span></span>';
  });
}
function toggleSize(s){ selectedSizes.includes(s)? selectedSizes=selectedSizes.filter(function(x){return x!=s}): selectedSizes.push(s); renderSizeColor(); }
function addExtraColor(){ var code=document.getElementById('extraColor').value; var name=document.getElementById('colorName').value; if(name){ selectedColors.push({name:name,code:code}); document.getElementById('colorName').value=''; renderSizeColor(); }}
function removeColor(name){ selectedColors=selectedColors.filter(function(x){return x.name!=name}); renderSizeColor(); }
function addExtraSize(){ var val=document.getElementById('extraSize').value.toUpperCase(); if(val &&!selectedSizes.includes(val)){ selectedSizes.push(val); document.getElementById('extraSize').value=''; renderSizeColor(); }}

function addProduct(e){
  e.preventDefault();
  var imageUrls = ["https://via.placeholder.com/400x400.png?text=No+Image"];
  var product = {
    name: document.getElementById('pName').value, images: imageUrls,
    price: Number(document.getElementById('pPrice').value), customerPrice: Number(document.getElementById('pPrice').value)+20,
    category: document.getElementById('pCategory').value, subcategory: document.getElementById('pSubcategory').value,
    district: document.getElementById('pDistrict').value, description: document.getElementById('pDesc').value, 
    sizes: selectedSizes, colors: selectedColors, stock: true, sellerId: currentUser.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  db.collection("products").add(product).then(function(){
    alert('Product Added!');
    document.getElementById('addProductForm').reset();
    selectedSizes=[]; selectedColors=[]; uploadedImages=[]; document.getElementById('imgPreview').innerHTML='';
    loadProducts(); openTab('products');
  }).catch(function(error){ alert("Error: " + error.message); });
}

function updateOrderStatus(id, status){
  db.collection("orders").doc(id).update({status:status}).then(function(){ alert("Status: " + status); loadOrders(); });
}

function downloadLabel(order){
  var w = window.open('', '', 'height=700,width=800');
  var codText = order.paymentMethod === "COD"? '<h2 style="color:red">CASH ON DELIVERY: ₹' + order.finalTotal + '</h2>' : '<h3 style="color:green">PREPAID: ₹' + order.finalTotal + '</h3>';
  w.document.write('<html><body><h2>Shipping Label</h2>' + codText + '<div><h3>TO: ' + order.customer.name + '</h3>' + order.customer.address + '</div><script>window.print()<\/script></body></html>');
  w.document.close();
}

function loadOrders(){
  db.collection("orders").orderBy("createdAt", "desc").get().then(function(snap){
    var html='';
    snap.forEach(function(d){ var o=d.data(); o.id=d.id;
      var statusOptions='';
      orderStatuses.forEach(function(s){ statusOptions += '<option ' + (o.status==s?'selected':'') + '>' + s + '</option>'; });
      html += '<tr><td>#' + d.id.substring(0,6) + '</td><td>' + o.customer.name + '</td><td>' + o.items.length + '</td><td>₹' + o.finalTotal + '</td><td><select class="status-select" onchange="updateOrderStatus(\'' + d.id + '\', this.value)">' + statusOptions + '</select></td><td><button class="btn-ship" onclick="downloadLabel(' + JSON.stringify(o).replace(/"/g, '&quot;') + ')">Label</button><button class="btn-delete" onclick="deleteOrder(\'' + d.id + '\')">Delete</button></td></tr>';
    });
    document.getElementById('ordersList').innerHTML=html || '<tr><td colspan="6">No orders</td></tr>';
  });
}

function deleteOrder(id){ if(confirm('Delete?')){ db.collection("orders").doc(id).delete().then(loadOrders); }}

function toggleStock(id, stock){ db.collection("products").doc(id).update({stock:!stock}).then(loadProducts); }

function loadProducts(){
  db.collection("products").get().then(function(snap){
    var html='';
    snap.forEach(function(d){ var p=d.data(); if(p.sellerId === currentUser.uid){
      html += '<tr><td><img src="' + p.images[0] + '" width="50"></td><td>' + p.name + '</td><td>₹' + p.customerPrice + '</td><td>' + p.category + '</td><td><button class="stock-toggle ' + (p.stock?'':'off') + '" onclick="toggleStock(\'' + d.id + '\', ' + p.stock + ')">' + (p.stock?'In Stock':'Out') + '</button></td><td><button class="btn-delete" onclick="deleteProduct(\'' + d.id + '\')">Delete</button></td></tr>';
    }});
    document.getElementById('productsList').innerHTML=html || '<tr><td colspan="6">No products</td></tr>';
  });
}
function deleteProduct(id){ if(confirm('Delete?')){ db.collection("products").doc(id).delete().then(loadProducts); }}
</script>
</body>
</html>
