<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seller Dashboard - Shopline Kerala</title>
<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
<style>
*{font-family:Roboto,Arial}
.dashboard{max-width:1200px; margin:20px auto; padding:20px}
.tabs{display:flex; gap:10px; margin-bottom:20px; border-bottom:2px solid #eee}
.tab-btn{padding:12px 20px; border:none; background:none; cursor:pointer; font-size:16px; font-weight:bold}
.tab-btn.active{border-bottom:3px solid #2874f0; color:#2874f0}
.tab-content{display:none}
.tab-content.active{display:block}
.form-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:15px}
.form-group{display:flex; flex-direction:column}
.form-group label{font-weight:bold; margin-bottom:5px; font-size:14px}
.form-group input,.form-group select,.form-group textarea{padding:10px; border:1px solid #ddd; border-radius:4px}
.btn-save{padding:12px 30px; background:#388e3c; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:16px; margin-top:15px}
.btn-upload{padding:10px 20px; background:#2874f0; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold}
.btn-logout{background:#d32f2f; color:#fff; padding:8px 15px; border:none; border-radius:4px; cursor:pointer; float:right}
.btn-add{background:#ff9f00; color:#fff; padding:8px 12px; border:none; border-radius:4px; cursor:pointer}
.img-preview{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap}
.img-box{position:relative}
.img-box img{width:100px; height:100px; object-fit:cover; border:1px solid #ddd; border-radius:4px}
.img-box span{position:absolute; top:0; right:0; background:red; color:#fff; cursor:pointer; padding:2px 6px; border-radius:50%}
.chip{padding:8px 12px; border:2px solid #ddd; border-radius:20px; cursor:pointer; background:#fff; display:inline-block; margin:3px}
.chip.active{border-color:#2874f0; background:#e3f2fd; color:#2874f0}
.price-box{background:#e8f5e9; padding:15px; border-radius:8px; margin-top:10px}
.section-title{margin-top:20px; margin-bottom:10px; color:#2874f0; border-bottom:1px solid #ddd; padding-bottom:5px}
</style>
</head>
<body>
<div style="background:#232f3e; color:#fff; padding:8px; text-align:center">Seller Panel - Shopline Kerala</div>
<header style="background:#2874f0; color:#fff; padding:15px">
  <div style="max-width:1200px; margin:auto; display:flex; justify-content:space-between">
    <div>Shopline<span style="color:#ffe500">Kerala</span> Seller</div>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</header>

<div class="dashboard">
  <div id="add" class="tab-content active">
    <h2>Add New Product</h2>
    <form id="addProductForm" onsubmit="addProduct(event)">
      <h3 class="section-title">1. Basic Details</h3>
      <div class="form-grid">
        <div class="form-group"><label>Product Name *</label><input id="pName" required></div>
        <div class="form-group"><label>Brand</label><input id="pBrand"></div>
        <div class="form-group"><label>Category *</label><select id="pCategory" onchange="updateSubcategory()" required><option value="">Select</option><option value="Men">Men</option><option value="Women">Women</option><option value="Kids">Kids</option></select></div>
        <div class="form-group"><label>Sub Category *</label><select id="pSubcategory" required></select></div>
        <div class="form-group"><label>District *</label><select id="pDistrict" required><option value="">Select</option><option>Ernakulam</option><option>Thrissur</option><option>Palakkad</option><option>Malappuram</option><option>Kozhikode</option></select></div>
      </div>

      <h3 class="section-title">2. Price & Stock</h3>
      <div class="form-grid">
        <div class="form-group"><label>Your Selling Price ₹ *</label><input id="pPrice" type="number" onkeyup="calcPrice()" required></div>
        <div class="form-group"><label>Old Price ₹</label><input id="pOldPrice" type="number"></div>
        <div class="form-group"><label>Stock Quantity *</label><input id="pStockQty" type="number" value="10" required></div>
      </div>
      <div class="price-box"><p>Platform Fee: ₹20 | <b>Customer Pays: ₹<span id="customerPrice">0</span></b></p></div>

      <h3 class="section-title">3. Shipping</h3>
      <div class="form-grid">
        <div class="form-group"><label>Product Weight *</label><div style="display:flex; gap:5px"><input id="pWeight" type="number" placeholder="250" required><select id="pWeightUnit"><option value="g">Grams</option><option value="kg">KG</option></select></div></div>
      </div>

      <h3 class="section-title">4. Attributes</h3>
      <div class="form-grid">
        <div class="form-group"><label>Fabric</label><select id="pFabric"><option value="">Select</option><option>Cotton</option><option>Polyester</option></select></div>
        <div class="form-group"><label>Sleeve</label><select id="pSleeve"><option value="">Select</option><option>Half Sleeve</option><option>Full Sleeve</option></select></div>
        <div class="form-group"><label>Fit</label><select id="pFit"><option value="">Select</option><option>Regular Fit</option><option>Slim Fit</option></select></div>
        <div class="form-group"><label>Pattern</label><select id="pPattern"><option value="">Select</option><option>Solid</option><option>Printed</option></select></div>
      </div>

      <h3 class="section-title">5. Variants</h3>
      <div class="form-group"><label>Sizes</label><div id="sizeGrid"></div><div style="display:flex; gap:5px; margin-top:8px"><input id="extraSize" placeholder="Add size"><button type="button" class="btn-add" onclick="addExtraSize()">+ Add</button></div></div>
      <div class="form-group"><label>Colors</label><div id="colorGrid"></div><div style="display:flex; gap:5px; margin-top:8px; align-items:center"><input type="color" id="extraColor"><input id="colorName" placeholder="Color Name"><button type="button" class="btn-add" onclick="addExtraColor()">+ Add</button></div></div>

      <h3 class="section-title">6. Images & Description</h3>
      <div class="form-group">
        <label>Product Images * Max 4</label>
        <button type="button" class="btn-upload" onclick="openUpload()">📷 Upload From Gallery</button>
        <input type="hidden" id="cloudinaryUrls">
        <div class="img-preview" id="imgPreview"></div>
        <small>Click button > Select from phone gallery > Done</small>
      </div>
      <div class="form-group"><label>Description</label><textarea id="pDesc" rows="4"></textarea></div>

      <button type="submit" class="btn-save">Save Product</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyCX7fx7XvW6duavBYrTrzysIQN5gPyfJGo", authDomain: "willwin-cart.firebaseapp.com", projectId: "willwin-cart"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let selectedSizes = []; let selectedColors = []; let uploadedUrls = [];
const categories = {"Men": ["Shirts", "T-Shirts"], "Women": ["Saree", "Kurtis"], "Kids": ["Frocks"]};

auth.onAuthStateChanged(function(user){ if(!user) location.href='login.html'; else{ renderSizeColor(); } });
function logout(){ auth.signOut().then(function(){ location.href='login.html'; }); }
function updateSubcategory(){ var cat = document.getElementById('pCategory').value; var sub = document.getElementById('pSubcategory'); sub.innerHTML = '<option value="">Select</option>'; if(categories[cat]){ categories[cat].forEach(function(s){ sub.innerHTML += '<option value="' + s + '">' + s + '</option>'; }); } }
function calcPrice(){ var price = Number(document.getElementById('pPrice').value)||0; document.getElementById('customerPrice').innerText = price + 20; }

function renderSizeColor(){
  var sizeGrid = document.getElementById('sizeGrid'); sizeGrid.innerHTML='';
  ['S','M','L','XL','XXL'].forEach(function(s){ var active = selectedSizes.includes(s)? 'active' : ''; sizeGrid.innerHTML += '<span class="chip ' + active + '" onclick="toggleSize(\'' + s + '\')">' + s + '</span>'; });
  var colorGrid = document.getElementById('colorGrid'); colorGrid.innerHTML='';
  selectedColors.forEach(function(c){ colorGrid.innerHTML += '<span class="chip active" style="background:' + c.code + '; color:#fff">' + c.name + ' <span onclick="removeColor(\'' + c.name + '\')" style="cursor:pointer">X</span></span>'; });
}
function toggleSize(s){ selectedSizes.includes(s)? selectedSizes=selectedSizes.filter(function(x){return x!=s}) : selectedSizes.push(s); renderSizeColor(); }
function addExtraSize(){ var val=document.getElementById('extraSize').value.trim().toUpperCase(); if(val &&!selectedSizes.includes(val)){ selectedSizes.push(val); document.getElementById('extraSize').value=''; renderSizeColor(); } }
function addExtraColor(){ var code=document.getElementById('extraColor').value; var name=document.getElementById('colorName').value.trim(); if(name){ selectedColors.push({name:name,code:code}); document.getElementById('colorName').value=''; renderSizeColor(); } }
function removeColor(name){ selectedColors=selectedColors.filter(function(x){return x.name!=name}); renderSizeColor(); }

// CLOUDINARY UPLOAD
var cloudName = "omve98do";
var uploadPreset = "shopline_unsigned";

function openUpload(){
  if(uploadedUrls.length >= 4) return alert("Max 4 images allowed");
  cloudinary.openUploadWidget({
    cloudName: cloudName,
    uploadPreset: uploadPreset,
    sources: ["local", "camera"],
    multiple: true,
    maxFiles: 4 - uploadedUrls.length,
    maxImageFileSize: 5000000
  },
  function(error, result) {
    if(!error && result.event === "success"){
      uploadedUrls.push(result.info.secure_url);
      document.getElementById('cloudinaryUrls').value = uploadedUrls.join(",");
      document.getElementById('imgPreview').innerHTML += `<div class="img-box"><img src="${result.info.secure_url}"><span onclick="removeImg('${result.info.secure_url}')">X</span></div>`;
    }
  });
}
function removeImg(url){
  uploadedUrls = uploadedUrls.filter(u => u!= url);
  document.getElementById('cloudinaryUrls').value = uploadedUrls.join(",");
  document.getElementById('imgPreview').innerHTML = '';
  uploadedUrls.forEach(u => {
    document.getElementById('imgPreview').innerHTML += `<div class="img-box"><img src="${u}"><span onclick="removeImg('${u}')">X</span></div>`;
  });
}

function addProduct(e){
  e.preventDefault();
  if(uploadedUrls.length === 0) return alert("Upload at least 1 image");

  let product = {
    name: document.getElementById('pName').value, brand: document.getElementById('pBrand').value,
    images: uploadedUrls, price: Number(document.getElementById('pPrice').value),
    customerPrice: Number(document.getElementById('pPrice').value)+20, oldPrice: Number(document.getElementById('pOldPrice').value)||0,
    stockQty: Number(document.getElementById('pStockQty').value), category: document.getElementById('pCategory').value,
    subcategory: document.getElementById('pSubcategory').value, district: document.getElementById('pDistrict').value,
    description: document.getElementById('pDesc').value, sizes: selectedSizes, colors: selectedColors,
    weight: document.getElementById('pWeight').value + document.getElementById('pWeightUnit').value,
    fabric: document.getElementById('pFabric').value, sleeve: document.getElementById('pSleeve').value,
    fit: document.getElementById('pFit').value, pattern: document.getElementById('pPattern').value,
    sellerId: auth.currentUser.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  db.collection("products").add(product).then(function(){
    alert('✅ Product Added Successfully!');
    document.getElementById('addProductForm').reset();
    selectedSizes=[]; selectedColors=[]; uploadedUrls=[];
    document.getElementById('imgPreview').innerHTML='';
    document.getElementById('cloudinaryUrls').value='';
    renderSizeColor();
  }).catch(function(error){ alert("❌ Save Error: " + error.message); });
}
</script>
</body>
</html>
