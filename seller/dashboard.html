<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard - Shopline Kerala</title>
<style>
body{font-family:Arial; background:#f1f3f6; padding:20px}
.container{max-width:800px; margin:auto; background:#fff; padding:20px; border-radius:8px}
input, select, textarea{width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:4px}
label{font-weight:bold; margin-top:10px; display:block}
.btn{background:#fb641b; color:#fff; padding:12px; border:none; border-radius:4px; cursor:pointer; width:100%; font-weight:bold}
.preview img{width:100px; height:100px; object-fit:cover; margin:5px; border:1px solid #ddd}
</style>
</head>
<body>
<div class="container">
  <h2>Add New Product</h2>

  <label>Product Name</label>
  <input type="text" id="name" placeholder="Ex: Cotton Kurti for Women">

  <label>Upload Images - From Cloudinary</label>
  <input type="file" id="images" multiple accept="image/*">
  <div class="preview" id="preview"></div>

  <label>Category</label>
  <select id="category" required>
    <option value="">Select Category</option>
    <option value="Mobiles">Mobiles</option>
    <option value="Fashion">Fashion</option>
    <option value="Electronics">Electronics</option>
    <option value="Home">Home & Kitchen</option>
    <option value="Grocery">Grocery</option>
    <option value="Beauty">Beauty & Personal Care</option>
    <option value="Furniture">Furniture</option>
    <option value="Toys">Toys & Baby</option>
    <option value="Sports">Sports & Fitness</option>
    <option value="Books">Books & Stationery</option>
    <option value="Automotive">Automotive</option>
    <option value="Jewelry">Jewelry</option>
  </select>

  <label>Subcategory</label>
  <select id="subcategory" required>
    <option value="">Select Subcategory</option>
  </select>

  <label>District</label>
  <select id="district" required>
    <option value="">Select District</option>
    <option>Thiruvananthapuram</option><option>Kollam</option><option>Pathanamthitta</option>
    <option>Alappuzha</option><option>Kottayam</option><option>Idukki</option>
    <option>Ernakulam</option><option>Thrissur</option><option>Palakkad</option>
    <option>Malappuram</option><option>Kozhikode</option><option>Wayanad</option>
    <option>Kannur</option><option>Kasaragod</option>
  </select>

  <label>Selling Price - Customer</label>
  <input type="number" id="customerPrice" placeholder="₹499">

  <label>Old Price - For Discount</label>
  <input type="number" id="oldPrice" placeholder="₹999">

  <label>Stock Quantity</label>
  <input type="number" id="stockQty" placeholder="10">

  <label>Description</label>
  <textarea id="description" rows="4" placeholder="Product details..."></textarea>

  <button class="btn" onclick="addProduct()">Add Product</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyCX7fx7XvW6duavBYrTrzysIQN5gPyfJGo", authDomain: "willwin-cart.firebaseapp.com", projectId: "willwin-cart"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// CLOUDINARY CONFIG
const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/omve98do/image/upload";
const CLOUDINARY_UPLOAD_PRESET = "shoplinekerala";

// CATEGORIES + SUBCATEGORIES
const subcats = {
  "Mobiles": ["Smartphones", "Feature Phones", "Mobile Accessories", "Tablets", "Power Banks"],
  "Fashion": ["Men's Wear", "Women's Wear", "Kids Wear", "T-Shirts", "Shirts", "Jeans", "Kurtis", "Sarees", "Dresses", "Footwear", "Bags"],
  "Electronics": ["TV", "Smart TV", "Laptops", "Headphones", "Speakers", "Camera", "Smart Watch", "Tablet"],
  "Home": ["Kitchen", "Furniture", "Tables", "Chairs", "Bedding", "Decor", "Mixer Grinder", "Cookware"],
  "Grocery": ["Rice", "Oil", "Spices", "Snacks", "Beverages", "Fruits & Vegetables", "Dairy", "Tea & Coffee"],
  "Beauty": ["Makeup", "Skincare", "Haircare", "Perfumes", "Men's Grooming", "Bath & Body"],
  "Furniture": ["Sofa", "Bed", "Wardrobe", "Dining Table", "Study Table", "Cupboard"],
  "Toys": ["Baby Toys", "Educational Toys", "Dolls", "Action Figures", "Games"],
  "Sports": ["Cricket", "Football", "Gym Equipment", "Yoga", "Cycles", "Badminton"],
  "Books": ["School Books", "Novels", "Stationery", "Art Supplies", "Magazines"],
  "Automotive": ["Bike Accessories", "Car Accessories", "Helmets", "Car Care"],
  "Jewelry": ["Gold Jewelry", "Silver Jewelry", "Bangles", "Earrings", "Necklace"]
}

document.getElementById('category').onchange = function(){
  let cat = this.value;
  let sub = document.getElementById('subcategory');
  sub.innerHTML = '<option value="">Select Subcategory</option>';
  if(subcats[cat]){
    subcats[cat].forEach(s => {
      sub.innerHTML += `<option value="${s}">${s}</option>`
    })
  }
}

// CLOUDINARY UPLOAD
document.getElementById('images').onchange = async function(e){
  let files = e.target.files;
  let preview = document.getElementById('preview');
  preview.innerHTML = '';
  for(let file of files){
    let formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    let res = await fetch(CLOUDINARY_URL, {method:'POST', body:formData});
    let data = await res.json();
    preview.innerHTML += `<img src="${data.secure_url}">`;
  }
}

async function addProduct(){
  let files = document.getElementById('images').files;
  let imageUrls = [];

  // Upload to Cloudinary
  for(let file of files){
    let formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    let res = await fetch(CLOUDINARY_URL, {method:'POST', body:formData});
    let data = await res.json();
    imageUrls.push(data.secure_url);
  }

  let product = {
    name: document.getElementById('name').value,
    images: imageUrls, // SAVE AS ARRAY
    category: document.getElementById('category').value,
    subcategory: document.getElementById('subcategory').value,
    district: document.getElementById('district').value,
    customerPrice: Number(document.getElementById('customerPrice').value),
    oldPrice: Number(document.getElementById('oldPrice').value),
    stockQty: Number(document.getElementById('stockQty').value),
    description: document.getElementById('description').value,
    createdAt: new Date()
  };

  await db.collection("products").add(product);
  alert("Product Added Successfully!");
  location.reload();
}
</script>
</body>
</html>
