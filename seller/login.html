<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Shopline India</title>
<style>
body{background:#f5f7fb;margin:0;font-family:Arial,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#fff;width:100%;max-width:380px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.08);padding:28px 24px;text-align:center}
.logo{color:#2874f0;font-size:26px;font-weight:bold}
.sub{color:#666;font-size:12px;margin:6px 0 22px}
.btn{width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;border:none}
.btn-google{background:#fff;color:#222;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-guest{background:#2874f0;color:#fff;margin-top:12px}
.link{color:#2874f0;font-size:13px;text-decoration:none;font-weight:bold;margin-top:16px;display:inline-block}
.foot{font-size:11px;color:#999;margin-top:22px}
.err{background:#ffebee;color:#d32f2f;padding:8px;border-radius:6px;font-size:12px;margin-bottom:10px;display:none}
.badge{background:#e3f2fd;color:#1565c0;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:bold;display:none;margin-bottom:10px}
.badge.show{display:inline-block}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="logo">Shopline India</div>
<div class="sub" id="subText">🇮🇳 India's Own Shopping Place<br>Delivery all over India</div>
<div class="badge" id="sellerBadge">SELLER MODE</div>
<div id="err" class="err"></div>

<button class="btn btn-google" onclick="googleLogin()">
  <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Continue with Google
</button>

<button class="btn btn-guest" id="guestBtn" onclick="location.href='../index.html'">Continue as Guest</button>

<a class="link" href="../index.html">← Back to Home</a>
<div class="foot">© 2026 Shopline India</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyCX7fx7XvW6duavBYrTrzysIQN5gPyfJGo", authDomain: "willwin-cart.firebaseapp.com", projectId: "willwin-cart"};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ADD YOUR SELLER EMAILS HERE
const ADMIN_EMAILS = ["srikrishnab83@gmail.com"];

const params = new URLSearchParams(window.location.search);
const isSellerMode = params.get('seller')==='1' || params.get('admin')==='1' || params.get('mode')==='seller';

if(isSellerMode){
  document.getElementById('sellerBadge').classList.add('show');
  document.getElementById('subText').innerHTML = "Seller Login<br>Only authorized sellers can access";
  document.getElementById('guestBtn').style.display='none';
}

window.googleLogin = async function(){
  const errBox = document.getElementById('err');
  try{
    await setPersistence(auth, browserLocalPersistence);
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    const email = result.user.email.toLowerCase();

    if(isSellerMode){
      // SELLER MODE: Check if admin
      if(!ADMIN_EMAILS.includes(email)){
        errBox.innerText = "Access denied: " + email + " is not authorized as seller. Only Shopline owner can access.";
        errBox.style.display='block';
        return;
      }
      await setDoc(doc(db,"sellers",result.user.uid),{name:result.user.displayName,email:email,uid:result.user.uid,role:"seller",lastLogin:serverTimestamp()},{merge:true});
      location.href='dashboard.html';
    } else {
      // BUYER MODE: Anyone can login
      await setDoc(doc(db,"buyers",result.user.uid),{name:result.user.displayName,email:email,uid:result.user.uid,role:"buyer",createdAt:serverTimestamp()},{merge:true});
      location.href='../index.html';
    }
  }catch(e){
    errBox.innerText = e.message;
    errBox.style.display='block';
  }
}
</script>
</body>
</html>
