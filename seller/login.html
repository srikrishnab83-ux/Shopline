<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Shopline India - Login">
<title>Login - Shopline India</title>
<style>
body{background:#f5f7fb;margin:0;font-family:Arial,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:400px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.08);padding:30px 25px;text-align:center}
.logo{color:#2874f0;font-size:24px;font-weight:bold;margin-bottom:6px}
.sub{color:#666;font-size:12px;margin-bottom:20px;line-height:1.4}
.tabs{display:none}
.tabs.show{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid #eee}
.tab{flex:1;padding:12px;cursor:pointer;font-size:14px;font-weight:bold;color:#666;border-bottom:3px solid transparent;background:none;border:none}
.tab.active{color:#2874f0;border-bottom:3px solid #2874f0}
.group{text-align:left;margin-bottom:15px}
.group label{font-size:13px;font-weight:bold;display:block;margin-bottom:6px;color:#333}
.group input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box}
.btn{width:100%;padding:12px;background:#fb641b;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:10px}
.link{margin-top:15px;font-size:13px;color:#2874f0;cursor:pointer;display:inline-block;text-decoration:none}
.div{margin:15px 0;border-top:1px solid #eee;position:relative}
.div span{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#fff;padding:0 10px;font-size:11px;color:#999}
.sw{display:none}
.sw.active{display:block}
.foot{font-size:11px;color:#888;margin-top:25px}
.err{background:#ffebee;color:#d32f2f;padding:10px;border-radius:6px;font-size:12px;margin-bottom:15px;display:none;text-align:left}
.ok{background:#e8f5e9;color:#2e7d32;padding:10px;border-radius:6px;font-size:12px;margin-bottom:15px;display:none;text-align:left}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="logo">Shopline India</div>
<div class="sub">🇮🇳 India's Own Shopping Place<br>🚚 Delivery all over India</div>
<div class="tabs" id="mainTabs">
<button class="tab active" id="buyTab" onclick="switchTab('buy')">I want to Buy</button>
<button class="tab" id="sellTab" onclick="switchTab('sell')">I want to Sell</button>
</div>
<div id="err" class="err"></div>
<div id="ok" class="ok"></div>
<div id="buyLogin" class="sw active">
<div class="group"><label>Email</label><input type="email" id="buyEmail" placeholder="Enter your email"></div>
<div class="group"><label>Password</label><input type="password" id="buyPass" placeholder="Enter password"></div>
<button class="btn" onclick="loginBuy()">Login</button>
<div style="margin-top:14px"><a class="link" onclick="showBuySignup()">New customer? Create Account</a></div>
<div class="div"><span>OR</span></div>
<a class="link" href="../index.html">← Continue as Guest</a>
</div>
<div id="buySignup" class="sw">
<div class="group"><label>Full Name</label><input type="text" id="suName" placeholder="Full name"></div>
<div class="group"><label>Email</label><input type="email" id="suEmail" placeholder="Email"></div>
<div class="group"><label>Password</label><input type="password" id="suPass" placeholder="Min 6 chars"></div>
<div class="group"><label>Confirm Password</label><input type="password" id="suConfirm" placeholder="Confirm"></div>
<button class="btn" onclick="signupBuy()">Create Account</button>
<div style="margin-top:14px"><a class="link" onclick="showBuyLogin()">Already have account? Login</a></div>
</div>
<div id="sellLogin" class="sw">
<div class="group"><label>Email</label><input type="email" id="sellEmail" placeholder="Email"></div>
<div class="group"><label>Password</label><input type="password" id="sellPass" placeholder="Password"></div>
<button class="btn" style="background:#2874f0" onclick="loginSell()">Login as Seller</button>
<div style="margin-top:12px"><a class="link" onclick="showSellSignup()">Create Seller Account</a></div>
<div style="margin-top:10px"><a class="link" onclick="switchTab('buy')">← Back</a></div>
</div>
<div id="sellSignup" class="sw">
<div class="group"><label>Full Name</label><input type="text" id="sellSuName" placeholder="Full name"></div>
<div class="group"><label>Email</label><input type="email" id="sellSuEmail" placeholder="Email"></div>
<div class="group"><label>Password</label><input type="password" id="sellSuPass" placeholder="Min 6 chars"></div>
<div class="group"><label>Confirm Password</label><input type="password" id="sellSuConfirm" placeholder="Confirm"></div>
<button class="btn" style="background:#2874f0" onclick="signupSell()">Create Seller Account</button>
<div style="margin-top:12px"><a class="link" onclick="showSellLogin()">Already seller? Login</a></div>
</div>
<div class="foot">© 2026 Shopline India<br>Made for India, by India</div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey: "AIzaSyCX7fx7XvW6duavBYrTrzysIQN5gPyfJGo", authDomain: "willwin-cart.firebaseapp.com", projectId: "willwin-cart"};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ADMIN = ["srikrishnab83@gmail.com"];
const p = new URLSearchParams(window.location.search);
if(p.get('admin')==='1' || p.get('seller')==='1' || p.get('mode')==='seller'){ document.getElementById('mainTabs').classList.add('show'); document.getElementById('sellTab').style.display='block'; }
window.switchTab=function(t){ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); document.querySelectorAll('.sw').forEach(x=>x.classList.remove('active')); if(t==='buy'){ document.getElementById('buyTab').classList.add('active'); document.getElementById('buyLogin').classList.add('active'); } else { document.getElementById('sellTab').classList.add('active'); document.getElementById('sellLogin').classList.add('active'); } }
window.showBuyLogin=function(){ document.querySelectorAll('.sw').forEach(x=>x.classList.remove('active')); document.getElementById('buyLogin').classList.add('active'); clr(); }
window.showBuySignup=function(){ document.querySelectorAll('.sw').forEach(x=>x.classList.remove('active')); document.getElementById('buySignup').classList.add('active'); clr(); }
window.showSellLogin=function(){ document.querySelectorAll('.sw').forEach(x=>x.classList.remove('active')); document.getElementById('sellLogin').classList.add('active'); clr(); }
window.showSellSignup=function(){ document.querySelectorAll('.sw').forEach(x=>x.classList.remove('active')); document.getElementById('sellSignup').classList.add('active'); clr(); }
function err(m){ const e=document.getElementById('err'); e.innerText=m; e.style.display='block'; document.getElementById('ok').style.display='none'; setTimeout(()=>e.style.display='none',4000); }
function ok(m){ const e=document.getElementById('ok'); e.innerText=m; e.style.display='block'; document.getElementById('err').style.display='none'; }
function clr(){ document.getElementById('err').style.display='none'; document.getElementById('ok').style.display='none'; }
window.loginBuy=async function(){ const email=document.getElementById('buyEmail').value.trim(); const pass=document.getElementById('buyPass').value; if(!email||!pass) return err("Enter email and password"); try{ await signInWithEmailAndPassword(auth,email,pass); ok("Login successful!"); const r=localStorage.getItem('redirectAfterLogin'); if(r==='cart') setTimeout(()=>location.href='../buyer/cart.html',800); else if(r==='orders') setTimeout(()=>location.href='../customer/order.html',800); else setTimeout(()=>location.href='../index.html',800); }catch(e){ err(e.message); } }
window.signupBuy=async function(){ const name=document.getElementById('suName').value.trim(); const email=document.getElementById('suEmail').value.trim(); const pass=document.getElementById('suPass').value; const c=document.getElementById('suConfirm').value; if(!name) return err("Enter name"); if(!email) return err("Enter email"); if(pass.length<6) return err("Min 6 chars"); if(pass!==c) return err("Passwords mismatch"); try{ const cred=await createUserWithEmailAndPassword(auth,email,pass); await setDoc(doc(db,"buyers",cred.user.uid),{name,email,uid:cred.user.uid,role:"buyer",createdAt:serverTimestamp()}); ok("Account created!"); setTimeout(()=>location.href='../index.html',1000); }catch(e){ err(e.message); } }
window.loginSell=async function(){ const email=document.getElementById('sellEmail').value.trim(); const pass=document.getElementById('sellPass').value; if(!email||!pass) return err("Enter email/pass"); if(!ADMIN.includes(email.toLowerCase())) return err("Access denied"); try{ await signInWithEmailAndPassword(auth,email,pass); ok("Login success!"); setTimeout(()=>location.href='dashboard.html',800); }catch(e){ err(e.message); } }
window.signupSell=async function(){ const name=document.getElementById('sellSuName').value.trim(); const email=document.getElementById('sellSuEmail').value.trim(); const pass=document.getElementById('sellSuPass').value; const c=document.getElementById('sellSuConfirm').value; if(!name) return err("Enter name"); if(!email) return err("Enter email"); if(pass.length<6) return err("Min 6 chars"); if(pass!==c) return err("Mismatch"); if(!ADMIN.includes(email.toLowerCase())) return err("Registration closed"); try{ const cred=await createUserWithEmailAndPassword(auth,email,pass); await setDoc(doc(db,"sellers",cred.user.uid),{sellerName:name,email,name,uid:cred.user.uid,role:"seller",createdAt:serverTimestamp()}); ok("Seller created!"); setTimeout(()=>location.href='dashboard.html',1000); }catch(e){ err(e.message); } }
</script>
</body>
</html>
