<!DOCTYPE html>
<html lang="en">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Shopline Kerala</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body{background:#f5f5f5; padding-bottom:70px}
    .order-container{max-width:900px; margin:20px auto; padding:15px}
    .order-card{background:#fff; border-radius:8px; padding:15px; margin-bottom:20px; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
    .order-head{display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding-bottom:10px; flex-wrap:wrap; gap:10px}
    .timeline{display:flex; justify-content:space-between; margin:20px 0; position:relative}
    .timeline::before{content:''; position:absolute; top:15px; left:10px; right:10px; height:2px; background:#ddd; z-index:0}
    .step{text-align:center; z-index:1; position:relative; flex:1}
    .step .dot{width:30px; height:30px; border-radius:50%; background:#ddd; margin:0 auto 5px; line-height:30px; color:#fff; font-size:14px}
    .step.active .dot{background:#388e3c}
    .step.current .dot{background:#2874f0}
    .step p{font-size:11px; color:#666}
    .step.active p{color:#388e3c; font-weight:bold}
    .step.current p{color:#2874f0; font-weight:bold}
    .item-row{display:flex; gap:15px; padding:12px 0; border-bottom:1px dashed #eee; align-items:center}
    .item-row img{width:80px; height:80px; object-fit:cover; border-radius:4px; border:1px solid #eee}
    .item-actions{margin-top:8px; display:flex; gap:8px; flex-wrap:wrap}
    .review-box{margin-top:15px; padding:15px; background:#f9f9f9; border-radius:8px; border:1px solid #e0e0e0; display:none}
    .review-box.show{display:block}
    .stars-review span{font-size:28px; color:#ccc; cursor:pointer; transition:0.2s}
    .stars-review span.active{color:#ffa500}
    .btn-rate{background:#2874f0; color:#fff; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; margin-top:10px; font-weight:bold}
    .btn-invoice{background:#9c27b0; color:#fff; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; margin-right:5px}
    .btn-return{background:#fff; color:#ff9800; border:1px solid #ff9800; padding:8px 15px; border-radius:4px; cursor:pointer}
    .btn-track{background:#fff; color:#2874f0; border:1px solid #2874f0; padding:8px 15px; border-radius:4px; cursor:pointer}
    .badge{padding:4px 10px; border-radius:12px; font-size:12px; font-weight:bold}
    .badge-delivered{background:#c8e6c9; color:#2e7d32}
    .badge-shipped{background:#e1bee7; color:#6a1b9a}
    .badge-cancelled{background:#ffcdd2; color:#c62828}
  </style>
</head>
<body>
  <header class="navbar" style="background:#2874f0; padding:12px; display:flex; justify-content:space-between; align-items:center; color:#fff">
    <div class="logo" onclick="location.href='../index.html'" style="cursor:pointer; font-weight:bold; font-size:20px">Shopline<span style="color:#ffe500">Kerala</span></div>
    <div><a href="../index.html" style="color:#fff; text-decoration:none">⬅ Home</a></div>
  </header>

  <div class="order-container">
    <h2>📦 My Orders - Order History</h2>
    <p style="color:#666; font-size:13px; margin-bottom:15px">DEBUG MODE: Showing ALL orders to find demo order</p>
    <div id="debugPanel" style="background:#fff3cd; border:2px solid #ffc107; padding:12px; border-radius:6px; margin-bottom:15px; font-size:12px; font-family:monospace; white-space:pre-wrap;"></div>
    <div id="myOrdersList">Loading your orders...</div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyCX7fx7XvW6duavBYrTrzysIQN5gPyfJGo", authDomain: "willwin-cart.firebaseapp.com", projectId: "willwin-cart"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let ratingsMap = {};

auth.onAuthStateChanged(user => {
  if(!user){ 
    document.getElementById('myOrdersList').innerHTML = '<div style="background:#fff;padding:30px;text-align:center;border-radius:8px"><h3>Please Login</h3><a href="../login.html" style="background:#2874f0;color:#fff;padding:10px 20px;border-radius:4px;text-decoration:none;display:inline-block;margin-top:10px">Login Now</a></div>';
    return; 
  }
  currentUser = user;
  loadMyOrdersForceAll();
});

// THIS VERSION SHOWS ALL ORDERS - NO FILTER - SO DEMO ORDER WILL 100% SHOW
async function loadMyOrdersForceAll(){
  const listEl = document.getElementById('myOrdersList');
  const debugEl = document.getElementById('debugPanel');
  
  try{
    debugEl.textContent = `Logged as:\nUID: ${currentUser.uid}\nEmail: ${currentUser.email}\n\nFetching ALL orders from Firestore...`;

    // NO WHERE FILTER - GET ALL
    const snap = await db.collection("orders").limit(100).get();
    
    debugEl.textContent += `\nTotal orders found in DB: ${snap.size}`;

    if(snap.empty){
      debugEl.textContent += `\n❌ No orders in DB at all! Your demo order was not saved. Check checkout code.`;
      listEl.innerHTML = '<div style="background:#fff;padding:30px;text-align:center;border-radius:8px"><h3>No orders in database</h3><p>Your checkout is not saving to orders collection.</p></div>';
      return;
    }

    let docs = [];
    let sample = null;
    snap.forEach(d=>{ 
      docs.push(d); 
      if(!sample) sample = d.data();
    });

    debugEl.textContent += `\nFirst order fields: ${Object.keys(sample).join(', ')}`;
    debugEl.textContent += `\nFirst order userId: ${sample.userId || 'MISSING'}`;
    debugEl.textContent += `\nFirst order customer: ${JSON.stringify(sample.customer||{}).substring(0,300)}`;
    debugEl.textContent += `\n\nShowing ALL ${docs.length} orders (ignoring owner filter) so demo order appears:`;

    // Sort by date
    docs.sort((a,b)=>{
      const ta = a.data().createdAt ? a.data().createdAt.seconds : 0;
      const tb = b.data().createdAt ? b.data().createdAt.seconds : 0;
      return tb - ta;
    });

    renderOrders(docs);

  }catch(e){
    console.error(e);
    listEl.innerHTML = `<div style="background:#fff;padding:20px;border-radius:8px">Error: ${e.message}</div>`;
    debugEl.textContent += `\nError: ${e.message}`;
  }
}

function renderOrders(docs){
  const listEl = document.getElementById('myOrdersList');
  if(docs.length===0){ listEl.innerHTML='<p>No orders</p>'; return; }
  let html='';
  docs.forEach(doc=>{
    const o = doc.data();
    const orderId = doc.id;
    const tracking = o.trackingStatus || 'Order Received';
    const isDelivered = tracking==='Delivered';
    const isCancelled = o.status==='Cancelled';
    const canReturn = isDelivered && o.canReturnTill && o.canReturnTill.toDate() > new Date() && o.returnStatus!=='requested';
    const steps = ['Order Received','Approved','Packed','Shipped','Out for Delivery','Delivered'];
    let trackIndex = steps.indexOf(tracking); if(trackIndex===-1) trackIndex=0;
    let timelineHTML = '<div class="timeline">';
    steps.forEach((s,i)=>{ let cls=''; if(i < trackIndex) cls='active'; else if(i===trackIndex) cls='current'; timelineHTML += `<div class="step ${cls}"><div class="dot">${i < trackIndex ? '✓' : i+1}</div><p>${s}</p></div>`; });
    timelineHTML += '</div>';
    let itemsHTML='';
    o.items.forEach((item, idx)=>{
      const productId = item.productId || item.id || '';
      const alreadyReviewed = (o.reviewedItems||[]).includes(productId);
      const uniqueKey = `${orderId}_${productId}_${idx}`;
      itemsHTML += `
      <div class="item-row">
        <img src="${item.image || item.images?.[0] || 'https://via.placeholder.com/80'}">
        <div style="flex:1">
          <h4>${item.name}</h4>
          <p style="font-size:13px;color:#666">Qty: ${item.qty} ${item.size?`| Size: ${item.size}`:''}</p>
          <p><b>₹${item.price}</b></p>
          <div class="item-actions">
            ${isDelivered && !alreadyReviewed ? `<button class="btn-rate" onclick="toggleReviewBox('${uniqueKey}')">⭐ Rate & Review</button>` : ''}
            ${alreadyReviewed ? `<span style="font-size:12px;color:#388e3c">✓ Reviewed</span>` : ''}
          </div>
          <div class="review-box" id="review-${uniqueKey}">
            <h4>Rate ${item.name.substring(0,30)}</h4>
            <div class="stars-review" id="stars-${uniqueKey}">
              <span onclick="setRating('${uniqueKey}',1)">★</span><span onclick="setRating('${uniqueKey}',2)">★</span><span onclick="setRating('${uniqueKey}',3)">★</span><span onclick="setRating('${uniqueKey}',4)">★</span><span onclick="setRating('${uniqueKey}',5)">★</span>
            </div>
            <textarea id="reviewText-${uniqueKey}" placeholder="What did you like?" rows="3" style="width:100%; margin-top:10px; padding:8px; border:1px solid #ddd; border-radius:4px"></textarea>
            <button class="btn-rate" onclick="submitReview('${orderId}','${productId}','${item.name.replace(/'/g,"")}','${uniqueKey}')">Submit Review</button>
            <button class="btn-track" style="margin-left:5px" onclick="toggleReviewBox('${uniqueKey}')">Cancel</button>
          </div>
        </div>
      </div>`;
    });
    html += `
    <div class="order-card">
      <div class="order-head">
        <div><b>Order #${orderId.substring(0,6).toUpperCase()}</b><br><small>${o.createdAt ? o.createdAt.toDate().toLocaleString("en-IN") : ''}</small><br><small style="color:red">Owner UID in DB: ${o.userId||o.customer?.uid||'MISSING'} | Your UID: ${currentUser.uid} | Match: ${o.userId===currentUser.uid||o.customer?.uid===currentUser.uid ? 'YES' : 'NO'}</small></div>
        <div><b>Total: ₹${o.finalTotal||0}</b><br><span class="badge ${isCancelled?'badge-cancelled': isDelivered?'badge-delivered':'badge-shipped'}">${isCancelled?'Cancelled':tracking}</span></div>
      </div>
      ${isCancelled ? `<p style="color:#c62828; padding:10px 0">Reason: ${o.cancelReason||''}</p>` : timelineHTML}
      ${itemsHTML}
      <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn-invoice" onclick="downloadInvoice('${orderId}')">🧾 Download Invoice (Meesho-type)</button>
        <button class="btn-track" onclick="trackCourier('${orderId}')">📦 Track Courier</button>
        ${canReturn ? `<button class="btn-return" onclick="returnProduct('${orderId}')">↩ Return Product</button>` : ''}
      </div>
    </div>`;
  });
  listEl.innerHTML = html;
}

function toggleReviewBox(key){ document.getElementById(`review-${key}`)?.classList.toggle('show'); }
function setRating(key, rating){ ratingsMap[key]=rating; document.querySelectorAll(`#stars-${key} span`).forEach((s,i)=>{ s.classList.toggle('active', i < rating); }); }
async function submitReview(orderId, productId, productName, uniqueKey){
  const rating = ratingsMap[uniqueKey]||0;
  if(rating===0) return alert("Select stars");
  const reviewText = document.getElementById(`reviewText-${uniqueKey}`).value.trim();
  if(!reviewText) return alert("Write review");
  await db.collection("reviews").add({ productId, productName, orderId, userId: currentUser.uid, userEmail: currentUser.email, rating, comment: reviewText, createdAt: firebase.firestore.FieldValue.serverTimestamp(), verifiedPurchase: true });
  await db.collection("orders").doc(orderId).update({ reviewedItems: firebase.firestore.FieldValue.arrayUnion(productId) });
  alert("✅ Review posted!"); loadMyOrdersForceAll();
}
function trackCourier(orderId){ db.collection("orders").doc(orderId).get().then(doc=>{ const o=doc.data(); alert(`📦 Tracking\nOrder: #${orderId.substring(0,8)}\nStatus: ${o.trackingStatus}\nCourier: ${o.courierName||'Shopline Logistics'}\nAWB: ${o.awb||'Updating'}\nLocation: ${o.courierLocation||'At warehouse'}`); }); }
function returnProduct(orderId){ let reason = prompt("Return reason?"); if(!reason) return; db.collection("orders").doc(orderId).update({returnStatus:'requested',returnReason:reason,returnRequestedAt: firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{ alert("Return requested"); loadMyOrdersForceAll(); }); }
function downloadInvoice(orderId){
  db.collection("orders").doc(orderId).get().then(doc=>{
    const o = doc.data();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();
    let y=12;
    pdf.setFillColor(40,116,240); pdf.rect(0,0,210,16,'F');
    pdf.setTextColor(255,255,255); pdf.setFontSize(14); pdf.setFont("helvetica","bold");
    pdf.text("Shopline Kerala - Tax Invoice",105,10,{align:"center"});
    pdf.setTextColor(0,0,0); y=22;
    pdf.setFontSize(10); pdf.setFont("helvetica","bold");
    pdf.text("Sold By (Shipper):",14,y); pdf.text("Billing Address:",110,y); y+=5;
    pdf.setFont("helvetica","normal"); pdf.setFontSize(8.5);
    pdf.text("Shopline Kerala Pvt Ltd, KINFRA Park, Calicut - 673001",14,y); pdf.text(o.customer?.name||'Customer',110,y); y+=4;
    pdf.text("GSTIN: 32ABCDE1234F1Z5 | support@shoplinekerala.com",14,y); 
    pdf.text((o.customer?.street||'')+', '+(o.customer?.district||''),110,y,{maxWidth:85}); y+=4;
    pdf.text(`Order: #${orderId.substring(0,8).toUpperCase()} | AWB: ${o.awb||''} | Courier: ${o.courierName||''}`,14,y); pdf.text(`Phone: ${o.customer?.phone||''}`,110,y); y+=7;
    pdf.setDrawColor(200); pdf.line(14,y,196,y); y+=6;
    pdf.setFillColor(245,245,245); pdf.rect(14,y-4,182,8,'F');
    pdf.setFont("helvetica","bold"); pdf.setFontSize(8);
    pdf.text("Product",15,y); pdf.text("HSN",75,y); pdf.text("Qty",90,y); pdf.text("Taxable",105,y); pdf.text("CGST",130,y); pdf.text("SGST",155,y); pdf.text("Total",175,y); y+=5;
    pdf.setFont("helvetica","normal");
    let subtotal=0,totalCgst=0,totalSgst=0,grand=0;
    o.items.forEach(item=>{
      const qty=item.qty||1; const base=item.price||0; const taxable=base*qty;
      const gstP=item.gstPercent||18; const gstAmt=taxable*gstP/100;
      subtotal+=taxable; totalCgst+=gstAmt/2; totalSgst+=gstAmt/2; grand+=taxable+gstAmt;
      if(y>265){ pdf.addPage(); y=15; }
      pdf.text((item.name||'Product').substring(0,22),15,y);
      pdf.text(item.hsn||'9999',75,y); pdf.text(String(qty),90,y);
      pdf.text(`Rs.${taxable.toFixed(0)}`,105,y);
      pdf.text(`Rs.${(gstAmt/2).toFixed(0)}`,130,y);
      pdf.text(`Rs.${(gstAmt/2).toFixed(0)}`,155,y);
      pdf.text(`Rs.${(taxable+gstAmt).toFixed(0)}`,175,y); y+=6;
    });
    y+=2; pdf.line(14,y,196,y); y+=7;
    pdf.setFont("helvetica","bold");
    pdf.text(`Taxable: Rs.${subtotal.toFixed(2)}`,120,y); y+=5;
    pdf.text(`CGST: Rs.${totalCgst.toFixed(2)} | SGST: Rs.${totalSgst.toFixed(2)}`,120,y); y+=6;
    pdf.setFontSize(11); pdf.text(`Grand Total: Rs.${grand.toFixed(2)}`,120,y);
    pdf.save(`Shopline-Invoice-${orderId.substring(0,8).toUpperCase()}.pdf`);
  });
}
</script>
</body>
</html>
