<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Orders - Shopline Kerala</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body{background:#f5f5f5}
    .order-container{max-width:900px; margin:20px auto; padding:15px}
    .order-card{background:#fff; border-radius:8px; padding:15px; margin-bottom:20px; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
    .order-head{display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding-bottom:10px; flex-wrap:wrap}
    .timeline{display:flex; justify-content:space-between; margin:20px 0; position:relative}
    .timeline::before{content:''; position:absolute; top:15px; left:0; right:0; height:2px; background:#ddd; z-index:0}
    .step{text-align:center; z-index:1; position:relative; flex:1}
    .step .dot{width:30px; height:30px; border-radius:50%; background:#ddd; margin:0 auto 5px; line-height:30px; color:#fff}
    .step.active .dot{background:#388e3c}
    .step p{font-size:12px}
    .item-row{display:flex; gap:15px; padding:10px 0; border-bottom:1px dashed #eee}
    .item-row img{width:80px; height:80px; object-fit:cover; border-radius:4px}
    .review-box{margin-top:15px; padding:15px; background:#f9f9f9; border-radius:8px; display:none}
    .stars-review span{font-size:24px; color:#ccc; cursor:pointer}
    .stars-review span.active{color:#ffa500}
    .btn-rate{background:#2874f0; color:#fff; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; margin-top:10px}
    .btn-invoice{background:#9c27b0; color:#fff; border:none; padding:8px 15px; border-radius:4px; cursor:pointer}
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo" onclick="location.href='../index.html'" style="cursor:pointer;">Shopline<span>Kerala</span></div>
    <div><a href="profile.html" style="color:#fff">Back</a></div>
  </header>

  <div class="order-container">
    <h2>📦 My Orders</h2>
    <div id="myOrdersList">Loading...</div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const { jsPDF } = window.jspdf;
const firebaseConfig = {apiKey: "AIzaSyCX7fx7XvW6duavBYrTrzysIQN5gPyfJGo", authDomain: "willwin-cart.firebaseapp.com", projectId: "willwin-cart"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUserId = null;

auth.onAuthStateChanged(user => {
  if(!user) location.href = '../index.html';
  else { currentUserId = user.uid; loadMyOrders(); }
});

async function loadMyOrders(){
  const snap = await db.collection("orders").where("userId","==",currentUserId).orderBy("createdAt","desc").get();
  let html = '';
  if(snap.empty) html = '<p>You have no orders yet</p>';

  snap.forEach(doc=>{
    const o = doc.data();
    const tracking = o.trackingStatus || 'Order Received';
    const steps = ['Order Received','Approved','Packed','Shipped','Out for Delivery','Delivered'];
    let timelineHTML = '<div class="timeline">';
    steps.forEach(s=>{
      let active = steps.indexOf(tracking) >= steps.indexOf(s) ? 'active' : '';
      timelineHTML += `<div class="step ${active}"><div class="dot">✓</div><p>${s}</p></div>`;
    });
    timelineHTML += '</div>';

    let itemsHTML = '';
    o.items.forEach(item=>{
      itemsHTML += `
      <div class="item-row">
        <img src="${item.image}">
        <div>
          <h4>${item.name}</h4>
          <p>Qty: ${item.qty} | Size: ${item.size} | Color: ${item.color}</p>
          <p><b>₹${item.price}</b></p>
        </div>
      </div>`;
    });

    // NEW: RATING SECTION - only if delivered
    let reviewHTML = '';
    if(tracking === 'Delivered'){
      reviewHTML = `
      <div class="review-box" id="review-${doc.id}">
        <h4>Rate this product</h4>
        <div class="stars-review" data-order="${doc.id}">
          <span onclick="setRating('${doc.id}',1)">★</span>
          <span onclick="setRating('${doc.id}',2)">★</span>
          <span onclick="setRating('${doc.id}',3)">★</span>
          <span onclick="setRating('${doc.id}',4)">★</span>
          <span onclick="setRating('${doc.id}',5)">★</span>
        </div>
        <textarea id="reviewText-${doc.id}" placeholder="Write your review..." rows="3" style="width:100%; margin-top:10px"></textarea>
        <button class="btn-rate" onclick="submitReview('${doc.id}')">Submit Review</button>
      </div>`;
    }

    html += `
    <div class="order-card">
      <div class="order-head">
        <div><b>Order #${doc.id.substring(0,6)}</b><br><small>${o.createdAt.toDate().toLocaleString("en-IN")}</small></div>
        <div><b>Total: ₹${o.finalTotal}</b><br><small>Status: ${tracking}</small></div>
      </div>
      ${timelineHTML}
      ${itemsHTML}
      <button class="btn-invoice" onclick="downloadInvoice('${doc.id}')">Download Invoice</button>
      ${reviewHTML}
    </div>`;
  });
  document.getElementById('myOrdersList').innerHTML = html;
}

let selectedRating = 0;
function setRating(orderId, rating){
  selectedRating = rating;
  document.querySelectorAll(`#review-${orderId} .stars-review span`).forEach((s,i)=>{
    s.classList.toggle('active', i < rating);
  });
}

// NEW: SUBMIT REVIEW - ONLY IF BOUGHT
function submitReview(orderId){
  const reviewText = document.getElementById(`reviewText-${orderId}`).value;
  if(selectedRating === 0) return alert("Please select stars");

  db.collection("orders").doc(orderId).get().then(orderDoc=>{
    const order = orderDoc.data();
    order.items.forEach(item=>{
      // Add review to product
      db.collection("products").doc(item.id).update({
        reviews: firebase.firestore.FieldValue.arrayUnion({
          userId: currentUserId,
          rating: selectedRating,
          review: reviewText,
          date: new Date()
        })
      });
      
      // Update average rating
      db.collection("products").doc(item.id).get().then(pDoc=>{
        const p = pDoc.data();
        const allRatings = p.reviews || [];
        const avg = allRatings.reduce((a,b)=>a+b.rating,0)/allRatings.length || selectedRating;
        db.collection("products").doc(item.id).update({rating: avg.toFixed(1)});
      })
    });
    alert("Thank you for your review!");
    document.getElementById(`review-${orderId}`).style.display = 'none';
  })
}

function downloadInvoice(orderId){
  db.collection("orders").doc(orderId).get().then(doc=>{
    const o = doc.data();
    const docPDF = new jsPDF();
    docPDF.setFontSize(18);
    docPDF.text("Shopline Kerala - Tax Invoice", 105, 20, {align: "center"});
    docPDF.setFontSize(12);
    docPDF.text(`Order ID: #${orderId.substring(0,6)}`, 14, 40);
    docPDF.text(`Customer: ${o.customer.name}`, 14, 50);
    docPDF.text(`Total: ₹${o.finalTotal}`, 14, 60);
    docPDF.save(`My-Invoice-${orderId.substring(0,6)}.pdf`);
  })
}
</script>
</body>
</html>
