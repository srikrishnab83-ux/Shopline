<!DOCTYPE html>
<html lang="en">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - Previous Style + Cancel Only</title>
<style>
*{box-sizing:border-box; margin:0; padding:0; font-family:Arial, sans-serif}
body{background:#f1f3f6}
header{background:#2874f0; color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center}
header a{color:#fff; text-decoration:none; font-weight:bold; font-size:14px}
.container{max-width:900px; margin:0 auto; padding:10px}
.page-title{font-size:22px; font-weight:bold; margin:15px 10px; display:flex; align-items:center; gap:8px}
.sub-title{font-size:13px; color:#666; margin:0 10px 15px}
.order-card{background:#fff; border-radius:10px; padding:15px; margin:12px 8px; box-shadow:0 1px 2px rgba(0,0,0,0.08)}
.order-top{display:flex; justify-content:space-between; flex-wrap:wrap}
.order-id{color:#2874f0; font-weight:bold; font-size:16px}
.order-date{color:#000; font-weight:normal}
.delivery-text{font-size:13px; color:#666; margin:4px 0}
.status-pill{display:inline-block; background:#e3f2fd; color:#1976d2; border:1px solid #90caf9; padding:5px 14px; border-radius:20px; font-size:13px; font-weight:500; margin:8px 0}
.order-divider{border:none; border-top:1px solid #f0f0f0; margin:12px 0}
.order-item{display:flex; gap:12px; align-items:flex-start}
.order-item img{width:80px; height:80px; object-fit:cover; border-radius:8px; border:1px solid #eee}
.item-name{font-weight:bold; font-size:15px}
.item-qty{font-size:13px; color:#666; margin:3px 0}
.item-price{font-weight:bold; font-size:15px; margin-top:4px}
.total-row{display:flex; justify-content:space-between; align-items:center; padding-top:12px; margin-top:5px; font-weight:bold; font-size:18px}
/* TRACKING TIMELINE - PREVIOUS TYPE */
.tracking{margin:15px 0 5px; padding:10px 0}
.tracking-title{font-size:12px; color:#878787; margin-bottom:10px; letter-spacing:0.5px}
.track-steps{display:flex; justify-content:space-between; position:relative; padding:0 5px}
.track-steps::before{content:''; position:absolute; top:12px; left:15px; right:15px; height:2px; background:#e0e0e0; z-index:0}
.track-step{position:relative; z-index:1; text-align:center; flex:1}
.dot{width:22px; height:22px; border-radius:50%; background:#e0e0e0; margin:0 auto 5px; border:3px solid #fff; box-shadow:0 0 0 1px #e0e0e0; display:flex; align-items:center; justify-content:center; font-size:10px}
.dot.active{background:#388e3c; box-shadow:0 0 0 1px #388e3c; color:#fff}
.dot.cancelled{background:#d32f2f; box-shadow:0 0 0 1px #d32f2f; color:#fff}
.step-label{font-size:10px; color:#878787; line-height:1.2}
.step-label.active{color:#388e3c; font-weight:bold}
.step-label.cancelled{color:#d32f2f; font-weight:bold}
/* CANCEL BUTTON - ONLY ADDITION */
.btn-cancel{background:#fff; color:#d32f2f; border:1.5px solid #d32f2f; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:13px; margin-top:12px; display:inline-flex; align-items:center; gap:6px}
.btn-cancel:hover{background:#ffebee}
.info-text{font-size:11px; color:#666; background:#f9f9f9; padding:8px 10px; border-radius:6px; margin-top:10px}
</style>
</head>
<body>

<header>
  <div style="font-weight:bold; font-size:18px">Shopline<span style="color:#ffe500">Kerala</span></div>
  <div style="display:flex; gap:15px"><a href="cart.html">🛒 Cart</a> | <a href="../index.html">Home</a></div>
</header>

<div class="container">
  <div class="page-title">📦 My Orders</div>
  <div class="sub-title">You can cancel order if placed wrongly - Delivery all over Kerala</div>
  <div id="ordersList">Loading your orders...</div>
</div>

<div id="cancelModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center; padding:15px">
  <div style="background:#fff; border-radius:10px; padding:20px; max-width:380px; width:100%">
    <h3>Cancel Order?</h3>
    <p style="font-size:13px; color:#666; margin:10px 0">If ordered wrongly, select reason to cancel:</p>
    <select id="cancelReason" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px">
      <option value="">Select Reason</option>
      <option value="Ordered by mistake">Ordered by mistake</option>
      <option value="Wrong size/color">Wrong size/color</option>
      <option value="Found cheaper elsewhere">Found cheaper elsewhere</option>
      <option value="Changed my mind">Changed my mind</option>
      <option value="Other">Other</option>
    </select>
    <div style="display:flex; gap:10px; margin-top:18px">
      <button onclick="closeCancelModal()" style="flex:1; padding:11px; background:#fff; border:1px solid #ddd; border-radius:6px; cursor:pointer">Keep Order</button>
      <button onclick="confirmCancel()" style="flex:1; padding:11px; background:#d32f2f; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold">Yes, Cancel</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {apiKey: "AIzaSyCX7fx7XvW6duavBYrTrzysIQN5gPyfJGo", authDomain: "willwin-cart.firebaseapp.com", projectId: "willwin-cart"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentCancelOrderId = null;
let currentUser = null;

onAuthStateChanged(auth, async (user) => {
  if(!user){
    document.getElementById('ordersList').innerHTML = '<p style="padding:20px">Please login to see orders. <a href="../seller/login.html">Login</a></p>';
    return;
  }
  currentUser = user;
  loadOrders(user.uid);
});

async function loadOrders(userId) {
  const ordersList = document.getElementById('ordersList');
  try {
    // NO orderBy to avoid index error - sort in JS
    const q = query(collection(db, "orders"), where("userId", "==", userId));
    const snap = await getDocs(q);

    if(snap.empty){
      ordersList.innerHTML = '<div style="text-align:center; padding:40px; background:#fff; border-radius:10px; margin:10px"><p>No orders yet</p><a href="../index.html" style="display:inline-block; margin-top:10px; background:#2874f0; color:#fff; padding:10px 20px; border-radius:6px; text-decoration:none">Start Shopping</a></div>';
      return;
    }

    let orders = [];
    snap.forEach(d => orders.push({id:d.id, data:d.data()}));
    orders.sort((a,b)=>{
      const ta = a.data.createdAt ? a.data.createdAt.toDate().getTime() : 0;
      const tb = b.data.createdAt ? b.data.createdAt.toDate().getTime() : 0;
      return tb-ta;
    });

    let html = '';
    orders.forEach(({id: orderId, data: order})=>{
      const date = order.createdAt ? new Date(order.createdAt.toDate()).toLocaleDateString() : '7/31/2026';
      const statusRaw = order.status || order.orderStatus || 'New Order';
      const status = statusRaw;
      const isCancelled = status.toLowerCase().includes('cancel');
      const isDelivered = status.toLowerCase().includes('deliver');
      const isShipped = status.toLowerCase().includes('ship');

      // Cancellable only if new order and within 24h
      let canCancel = (status === 'New Order' || status === 'Order Received' || status === 'Pending' || status === 'new') && !isCancelled && !isDelivered;
      if(order.createdAt && canCancel){
        const diffH = (Date.now() - order.createdAt.toDate().getTime())/(1000*60*60);
        if(diffH > 24) canCancel = false;
      }

      // Tracking steps - previous type
      let trackingHtml = '';
      if(!isCancelled){
        trackingHtml = `
          <div class="tracking">
            <div class="tracking-title">TRACKING</div>
            <div class="track-steps">
              <div class="track-step">
                <div class="dot active">✓</div>
                <div class="step-label active">Order<br>Received</div>
              </div>
              <div class="track-step">
                <div class="dot ${status !== 'New Order' && status !== 'Pending' ? 'active' : ''}">${status !== 'New Order' && status !== 'Pending' ? '✓' : ''}</div>
                <div class="step-label ${status !== 'New Order' && status !== 'Pending' ? 'active' : ''}">Confirmed</div>
              </div>
              <div class="track-step">
                <div class="dot ${isShipped || isDelivered ? 'active' : ''}">${isShipped || isDelivered ? '✓' : ''}</div>
                <div class="step-label ${isShipped || isDelivered ? 'active' : ''}">Shipped</div>
              </div>
              <div class="track-step">
                <div class="dot ${isDelivered ? 'active' : ''}">${isDelivered ? '✓' : ''}</div>
                <div class="step-label ${isDelivered ? 'active' : ''}">Delivered</div>
              </div>
            </div>
          </div>
        `;
      } else {
        trackingHtml = `
          <div class="tracking">
            <div class="tracking-title">TRACKING</div>
            <div class="track-steps">
              <div class="track-step">
                <div class="dot cancelled">✕</div>
                <div class="step-label cancelled">Cancelled<br>${order.cancelReason ? order.cancelReason : ''}</div>
              </div>
            </div>
          </div>
        `;
      }

      let itemsHtml = '';
      (order.items || []).forEach(item=>{
        itemsHtml += `
          <div class="order-item">
            <img src="${item.image}" onerror="this.src='https://via.placeholder.com/80?text=No+Image'">
            <div>
              <div class="item-name">${item.name}</div>
              <div class="item-qty">Qty: ${item.qty || 1}</div>
              <div class="item-price">₹${item.price}</div>
            </div>
          </div>
        `;
      });

      html += `
        <div class="order-card">
          <div class="order-top">
            <div>
              <span class="order-id">Order #${orderId.substring(0,8)}</span><span class="order-date"> - ${date}</span>
              <div class="delivery-text">Delivery all over Kerala</div>
              <span class="status-pill">${status}</span>
            </div>
          </div>
          <hr class="order-divider">
          ${itemsHtml}
          ${trackingHtml}
          <div class="total-row"><span>Total:</span><span>₹${(order.finalTotal || order.productTotal || 0).toLocaleString()}</span></div>
          ${canCancel ? `<button class="btn-cancel" onclick="openCancelModal('${orderId}')">❌ Cancel Order</button><div class="info-text">If ordered wrongly, you can cancel within 24 hours.</div>` : isCancelled ? `<div class="info-text" style="background:#ffebee; color:#d32f2f">Cancelled: ${order.cancelReason || 'Ordered by mistake'}</div>` : ''}
        </div>
      `;
    });

    ordersList.innerHTML = html;

  } catch(e){
    document.getElementById('ordersList').innerHTML = `<p style="color:#d32f2f; background:#fff; padding:20px; border-radius:8px">Error: ${e.message}</p>`;
  }
}

window.openCancelModal = function(id){ currentCancelOrderId=id; document.getElementById('cancelModal').style.display='flex'; }
window.closeCancelModal = function(){ document.getElementById('cancelModal').style.display='none'; currentCancelOrderId=null; document.getElementById('cancelReason').value=''; }

window.confirmCancel = async function(){
  const reason = document.getElementById('cancelReason').value;
  if(!reason) return alert('Please select reason');
  try{
    await updateDoc(doc(db,"orders",currentCancelOrderId),{
      status:"Cancelled",
      orderStatus:"cancelled",
      trackingStatus:"Cancelled by Customer",
      cancelReason:reason,
      cancelledAt:serverTimestamp(),
      cancelledBy: currentUser ? currentUser.uid : 'customer'
    });
    alert('✅ Order Cancelled Successfully.');
    closeCancelModal();
    loadOrders(currentUser.uid);
  }catch(e){ alert('Failed: '+e.message); }
}
</script>
</body>
</html>
