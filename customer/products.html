<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Shopline Kerala</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- SAME HEADER AS HOMEPAGE -->
  <div class="top-bar">
    <p>Delivering across all 14 districts of Kerala | COD Available</p>
  </div>
  <header class="navbar">
    <div class="container">
      <div class="logo" onclick="location.href='../index.html'" style="cursor:pointer;">Shopline<span>Kerala</span></div>
      <div class="search-wrap">
        <input type="text" placeholder="Search for products..." id="searchInput">
        <button id="searchBtn">🔍</button>
      </div>
      <div class="nav-icons">
        <a href="auth.html" id="authLink">Login</a>
        <a href="cart.html">🛒 Cart</a>
      </div>
    </div>
  </header>

  <!-- FILTERS -->
  <section class="filters">
    <div class="container">
      <h3>Filters</h3>
      <select id="districtFilter">
        <option value="">All Districts</option>
        <option>Kozhikode</option>
        <option>Ernakulam</option>
        <option>Thiruvananthapuram</option>
        <option>Thrissur</option>
        <option>Malappuram</option>
        <!-- Add all 14 districts -->
      </select>
      <select id="priceFilter">
        <option value="">All Prices</option>
        <option value="0-500">Under ₹500</option>
        <option value="500-2000">₹500 - ₹2000</option>
        <option value="2000-10000">₹2000 - ₹10000</option>
      </select>
    </div>
  </section>

  <!-- PRODUCT RESULTS -->
  <section class="products-page">
    <div class="container">
      <h2 id="resultTitle">All Products</h2>
      <p id="resultCount">Loading...</p>
      <div class="product-grid-4" id="productGrid">
        <!-- Products will load here from Firebase -->
      </div>
    </div>
  </section>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <a href="../index.html">🏠<br>Home</a>
    <a href="products.html" class="active">🛍️<br>Shop</a>
    <a href="cart.html">🛒<br>Cart</a>
    <a href="profile.html">👤<br>Account</a>
  </div>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
