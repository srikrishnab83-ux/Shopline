<!DOCTYPE html>
<html lang="en">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Shopline Kerala - Auto Push Added</title>
<style>
*{box-sizing:border-box; margin:0; padding:0; font-family:Arial, sans-serif}
body{background:#f1f3f6}
header{background:#2874f0; color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10}
header a{color:#fff; text-decoration:none; font-weight:bold}
.container{max-width:1000px; margin:15px auto; padding:0 10px; display:flex; gap:15px; flex-wrap:wrap}
.cart-left{flex:2; min-width:300px}
.cart-right{flex:1; min-width:280px; background:#fff; padding:15px; border-radius:8px; height:fit-content; position:sticky; top:70px}
.cart-item{background:#fff; padding:12px; border-radius:8px; margin-bottom:10px; display:flex; gap:12px; box-shadow:0 1px 2px rgba(0,0,0,0.08)}
.cart-item img{width:80px; height:80px; object-fit:cover; border-radius:6px; border:1px solid #eee}
.qty-box{display:flex; align-items:center; gap:8px; margin-top:8px}
.qty-btn{width:28px; height:28px; border:1px solid #ccc; background:#fff; border-radius:50%; cursor:pointer; font-weight:bold}
.form-group{margin:10px 0}
.form-group input, .form-group textarea, .form-group select{width:100%; padding:10px; border:1px solid #ddd; border-radius:6px; font-size:14px}
.btn-place{width:100%; padding:14px; background:#fb641b; color:#fff; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:10px}
.btn-place:disabled{background:#ccc; cursor:not-allowed}
.price-row{display:flex; justify-content:space-between; margin:8px 0; font-size:14px}
.price-row.total{font-weight:bold; font-size:16px; border-top:1px dashed #ddd; padding-top:10px}
</style>
</head>
<body>

<header>
  <div><a href="../index.html">Shopline<span style="color:#ffe500">Kerala</span></a></div>
  <div><a href="order.html">My Orders</a></div>
</header>

<div class="container">
  <div class="cart-left">
    <h3 style="margin:10px 0">🛒 My Cart</h3>
    <div id="cartItems">Loading...</div>
  </div>

  <div class="cart-right">
    <h3>Delivery Address</h3>
    <p style="font-size:11px; color:#666">Delivery all over Kerala</p>
    
    <div class="form-group"><input type="text" id="custName" placeholder="Full Name *" required></div>
    <div class="form-group"><input type="tel" id="custPhone" placeholder="Phone Number *" required></div>
    <div class="form-group"><textarea id="custAddress" placeholder="Street, House No *" rows="2" required></textarea></div>
    <div class="form-group">
      <select id="custDistrict">
        <option value="">Select District *</option>
        <option>Thiruvananthapuram</option><option>Kollam</option><option>Pathanamthitta</option><option>Alappuzha</option><option>Kottayam</option><option>Idukki</option><option>Ernakulam</option><option>Thrissur</option><option>Palakkad</option><option>Malappuram</option><option>Kozhikode</option><option>Wayanad</option><option>Kannur</option><option>Kasaragod</option>
      </select>
    </div>
    <div class="form-group"><input type="text" id="custPincode" placeholder="Pincode *" required></div>
    <div class="form-group"><textarea id="custLandmark" placeholder="Landmark (Optional)" rows="1"></textarea></div>

    <div style="margin:15px 0; background:#f9f9f9; padding:10px; border-radius:6px">
      <div class="price-row"><span>Items Total:</span><span id="itemsTotal">₹0</span></div>
      <div class="price-row"><span>Delivery:</span><span style="color:#388e3c">FREE - Delivery all over Kerala</span></div>
      <div class="price-row total"><span>Total Payable:</span><span id="finalTotal">₹0</span></div>
    </div>

    <button id="placeOrderBtn" class="btn-place" onclick="placeOrder()">Place Order</button>
    <p style="font-size:10px; color:#666; margin-top:8px; text-align:center">You can cancel order within 24 hours if ordered wrongly</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {apiKey: "AIzaSyCX7fx7XvW6duavBYrTrzysIQN5gPyfJGo", authDomain: "willwin-cart.firebaseapp.com", projectId: "willwin-cart"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let cart = JSON.parse(localStorage.getItem('cart')) || [];

onAuthStateChanged(auth, async (user)=>{
  if(user){
    currentUser = user;
    // Auto-fill name if available
    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if(userDoc.exists()){
        const data = userDoc.data();
        if(data.name) document.getElementById('custName').value = data.name;
        if(data.phone) document.getElementById('custPhone').value = data.phone;
      }
    } catch(e){}
  }
});

function renderCart() {
  const container = document.getElementById('cartItems');
  if(cart.length === 0){
    container.innerHTML = '<div style="background:#fff; padding:30px; border-radius:8px; text-align:center"><p>Your cart is empty</p><a href="../index.html" style="display:inline-block; margin-top:10px; background:#2874f0; color:#fff; padding:8px 16px; border-radius:6px; text-decoration:none">Shop Now</a></div>';
    document.getElementById('itemsTotal').innerText = '₹0';
    document.getElementById('finalTotal').innerText = '₹0';
    document.getElementById('placeOrderBtn').disabled = true;
    return;
  }

  let html = '';
  let total = 0;
  cart.forEach((item, idx)=>{
    total += item.price * item.qty;
    html += `
      <div class="cart-item">
        <img src="${item.image}" onerror="this.src='https://via.placeholder.com/80?text=No+Image'">
        <div style="flex:1">
          <b style="font-size:14px">${item.name}</b><br>
          <span style="font-size:12px; color:#666">${item.size || ''} ${item.color || ''}</span><br>
          <b>₹${item.price}</b>
          <div class="qty-box">
            <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
            <button onclick="removeItem(${idx})" style="margin-left:15px; background:none; border:none; color:#d32f2f; cursor:pointer; font-size:12px">Remove</button>
          </div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
  document.getElementById('itemsTotal').innerText = '₹' + total.toLocaleString();
  document.getElementById('finalTotal').innerText = '₹' + total.toLocaleString();
}

window.changeQty = function(idx, delta){
  cart[idx].qty += delta;
  if(cart[idx].qty <= 0) cart.splice(idx, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}
window.removeItem = function(idx){
  cart.splice(idx, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

renderCart();

// ===== AUTOMATIC PUSH NOTIFICATION LOGIC - ADDED =====
async function sendAutoNotificationToAdmin(orderId, orderData) {
  try {
    // 1. Create admin notification - Admin push page listens to this collection automatically
    await addDoc(collection(db, "admin_notifications"), {
      type: "new_order",
      title: "🔔 New Order Received!",
      body: `Order #${orderId.substring(0,6)} - ₹${orderData.finalTotal} - ${orderData.customer.name} - ${orderData.customer.phone} - ${orderData.items.map(i=>i.name).join(', ')}`,
      orderId: orderId,
      customerName: orderData.customer.name,
      customerPhone: orderData.customer.phone,
      total: orderData.finalTotal,
      items: orderData.items.map(i=>({name:i.name, qty:i.qty, price:i.price})),
      district: orderData.customer.district,
      createdAt: serverTimestamp(),
      read: false,
      delivery: "Delivery all over Kerala"
    });

    console.log('✅ Auto notification sent to admin - Owner will get push instantly');

    // 2. Optional: If you have FCM Cloud Function deployed, it will auto send FCM push from admin_notifications collection
    // Cloud Function watches admin_notifications and sends FCM to all admin_tokens

  } catch(e) {
    console.error('Auto notify error (order still placed):', e);
    // Don't block order if notification fails
  }
}

window.placeOrder = async function() {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const street = document.getElementById('custAddress').value.trim();
  const district = document.getElementById('custDistrict').value;
  const pincode = document.getElementById('custPincode').value.trim();
  const landmark = document.getElementById('custLandmark').value.trim();

  if(!name || !phone || !street || !district || !pincode){
    return alert('Please fill all required fields *');
  }
  if(cart.length === 0) return alert('Cart empty');

  const btn = document.getElementById('placeOrderBtn');
  btn.disabled = true;
  btn.innerText = 'Placing Order...';

  try {
    const itemsTotal = cart.reduce((sum, i)=> sum + i.price * i.qty, 0);
    
    const orderData = {
      userId: currentUser ? currentUser.uid : 'guest_' + Date.now(),
      items: cart,
      productTotal: itemsTotal,
      finalTotal: itemsTotal,
      deliveryCharge: 0,
      customer: {
        name: name,
        phone: phone,
        street: street,
        district: district,
        pincode: pincode,
        landmark: landmark
      },
      status: "New Order",
      orderStatus: "new",
      trackingStatus: "Order Received",
      paymentMethod: "COD",
      createdAt: serverTimestamp(),
      deliveryInfo: "Delivery all over Kerala"
    };

    // 1. Create order
    const orderRef = await addDoc(collection(db, "orders"), orderData);
    const orderId = orderRef.id;

    // 2. AUTOMATIC PUSH NOTIFICATION TO YOU - No manual work needed!
    await sendAutoNotificationToAdmin(orderId, orderData);

    // 3. Clear cart and redirect
    localStorage.removeItem('cart');
    alert(`✅ Order Placed Successfully! Order ID: #${orderId.substring(0,8)}\n\nYou can cancel within 24 hours if ordered wrongly. Delivery all over Kerala.`);
    
    window.location.href = `order.html?id=${orderId}`;

  } catch(e) {
    console.error(e);
    alert('Order failed: ' + e.message);
    btn.disabled = false;
    btn.innerText = 'Place Order';
  }
}
</script>
</body>
</html>
